name: Pipeline de Testes E2E (Self Hosted)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: self-hosted 
    
    steps:
      - name: Clone do Projeto
        uses: actions/checkout@v4

      - name: Instalar Depedências
        run: npm ci

      - name: Instalar Browsers do Playwright
        run: npx playwright install --with-deps

      - name: Executar os testes e2e
        run: npx playwright test