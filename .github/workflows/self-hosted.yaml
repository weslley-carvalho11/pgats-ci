name: Pipeline de Testes E2E (Self Hosted)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: self-hosted 

    steps:
      # 1. Clone do projeto
      - uses: actions/checkout@v4

      # 2. Instalação das dependências do seu projeto
      - name: Instalando dependências
        run: yarn install --frozen-lockfile

      # 3. Baixa os navegadores E as dependências de sistema do Linux de uma vez só!
      - name: Instalando Browsers e Dependências do Playwright
        run: npx playwright install --with-deps

      # 4. Executar os testes e2e
      - name: Executando testes e2e
        run: yarn run e2e