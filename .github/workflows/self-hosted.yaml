name: Pipeline de Testes E2E (Self Hosted)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: self-hosted 
    
    steps:
      - name: Clone do Projeto
        uses: actions/checkout@v4

      - name: Instalar Depedências
        run: npm install --legacy-peer-deps

      - name: Instalar Browsers do Playwright
        shell: cmd
        run: node node_modules\playwright\cli.js install --with-deps

      - name: Executar os testes e2e
        shell: cmd
        run: npx playwright test
        env:
          CI: true
          DEBUG: pw:browser*
